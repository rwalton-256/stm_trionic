;-------------------------------------------------------------------------------
; stm_trionic - minimal TunerStudio project definition
; Protocol: msEnvelope_1.0 over TCP (port 29001), same framing as Speeduino.
;-------------------------------------------------------------------------------

[MegaTune]
   MTversion      = 2.25
   queryCommand   = "Q"
   signature      = "speeduino 202306-stm_trionic"
   versionInfo    = "S"

[TunerStudio]
   iniSpecVersion = 3.64

;-------------------------------------------------------------------------------
[Constants]
   endianness            = little
   nPages                = 1
   pageSize              = 64
   pageIdentifier        = "\x00\x01"
   burnCommand           = "b%2i"
   pageReadCommand       = "p%2i%2o%2c"
   pageValueWrite        = "M%2i%2o%2c%v"
   pageChunkWrite        = "M%2i%2o%2c%v"
   crc32CheckCommand     = "d%2i"
   messageEnvelopeFormat = msEnvelope_1.0
   blockingFactor        = 251
   tableBlockingFactor   = 256
   delayAfterPortOpen    = 1000
   interWriteDelay       = 5
   pageActivationDelay   = 10

page = 1
   ;  name            = class,  type, offset, units,   scale, translate, lo, hi, digits
   toothPositions     = scalar, U08,  0,      "teeth", 1,     0,         2,  255, 0
   missingTeeth       = scalar, U08,  1,      "teeth", 1,     0,         0,  10,  0
   battRatio          = scalar, U16,  2,      ":1",    0.001, 0,         1,  20,  3
   in5vRatio          = scalar, U16,  4,      ":1",    0.001, 0,         1,  5,   3
   thermPullup        = scalar, U16,  6,      "ohm",   1,     0,         100, 10000, 0
   thermR25           = scalar, U16,  8,      "ohm",   1,     0,         100, 60000, 0
   thermBeta          = scalar, U16, 10,      "K",     1,     0,         1000, 6000, 0
   tpsMin             = scalar, U16, 12,      "V",     0.001, 0,         0,  5,   2
   tpsMax             = scalar, U16, 14,      "V",     0.001, 0,         0,  5,   2
   mapKpa0            = scalar, U16, 16,      "kPa",   0.1,   0,         0,  500, 1
   mapKpa5            = scalar, U16, 18,      "kPa",   0.1,   0,         0,  500, 1
   afr0               = scalar, U08, 20,      "AFR",   0.1,   0,         5,  25,  1
   afr5               = scalar, U08, 21,      "AFR",   0.1,   0,         5,  25,  1
   triggerAngle       = scalar, U16, 22,      "deg",   1,     0,         0,  359, 0
   fixedAdvance       = scalar, S08, 24,      "deg",   1,     0,         -10, 45, 0
   sparkPulse         = scalar, U16, 25,      "us",    1,     0,         500, 2000, 0
   injPw              = scalar, U16, 27,      "ms",    0.001, 0,         0,  60,  2
   injAngle           = scalar, U16, 29,      "deg",   1,     0,         0,  359, 0
   revLimit           = scalar, U16, 31,      "rpm",   1,     0,         1000, 9000, 0
   enableFuel         = bits,   U08, 33, [0:0], "Off", "On"
   enableSpark        = bits,   U08, 33, [1:1], "Off", "On"
   simRpm             = scalar, U16, 34,      "rpm",   1,     0,         0,  9000, 0
   benchIgn           = bits,   U08, 36, [0:0], "Off", "On"

;-------------------------------------------------------------------------------
[OutputChannels]
   ochGetCommand   = "r\x00\x30%2o%2c"
   ochBlockSize    = 64

   secl            = scalar, U08,  0, "sec",   1, 0
   rpm             = scalar, U16,  1, "rpm",   1, 0
   tooth           = scalar, U08,  3, "",      1, 0
   synced          = scalar, U08,  4, "",      1, 0
   syncLosses      = scalar, U16,  5, "",      1, 0
   toothPeriod     = scalar, U16,  7, "us",    1, 0
   revs            = scalar, U32,  9, "",      1, 0
   mcuTemp         = scalar, U08, 13, "C",     1, -40
   batteryVoltage  = scalar, U08, 14, "V",     0.1, 0
   iat             = scalar, U08, 15, "C",     1, -40
   coolant         = scalar, U08, 16, "C",     1, -40
   tps             = scalar, U08, 17, "%",     0.5, 0
   map             = scalar, U16, 18, "kPa",   0.1, 0
   afr             = scalar, U08, 20, "AFR",   0.1, 0
   tpsVolts        = scalar, U16, 22, "V",     0.001, 0
   staleEdges      = scalar, U16, 24, "",      1, 0
   gapMismatch     = scalar, U16, 26, "",      1, 0
   overcount       = scalar, U16, 28, "",      1, 0
   stopEvents      = scalar, U16, 30, "",      1, 0
   advance         = scalar, S08, 32, "deg",   1, 0
   fuelOn          = bits,   U08, 33, [0:0]
   sparkOn         = bits,   U08, 33, [1:1]
   revLimited      = bits,   U08, 33, [2:2]
   simActive       = bits,   U08, 33, [3:3]
   pulseWidth      = scalar, U16, 34, "ms",    0.001, 0
   sparkCount      = scalar, U16, 36, "",      1, 0
   injCount        = scalar, U16, 38, "",      1, 0
   sparkSkipped    = scalar, U16, 40, "",      1, 0
   overlaps        = scalar, U16, 42, "",      1, 0
   sparkPulses     = scalar, U16, 44, "",      1, 0
   injPulses       = scalar, U16, 46, "",      1, 0
   sdState         = scalar, U08, 48, "",      1, 0
   sdError         = scalar, U08, 49, "",      1, 0
   sdSize          = scalar, U16, 50, "GB",    0.1, 0
   sdFree          = scalar, U16, 52, "GB",    0.1, 0
   sdWriteErrors   = scalar, U16, 54, "",      1, 0
   sdReady         = { sdState == 1 }
   powerState      = scalar, U08, 56, "",      1, 0
   ignInput        = bits,   U08, 57, [0:0]
   mainRelay       = bits,   U08, 57, [1:1]
   fuelPump        = bits,   U08, 57, [2:2]
   benchIgnOn      = bits,   U08, 57, [3:3]
   heldAwake       = bits,   U08, 57, [4:4]
   sleepIn         = scalar, U16, 58, "s",     0.1, 0
   ignOn           = { powerState == 1 }

   time            = { timeNow }

;-------------------------------------------------------------------------------
[Menu]
   menu = "&Settings"
      subMenu = triggerSettings, "Trigger wheel"
      subMenu = simSettings,     "Crank simulator"
      subMenu = batterySettings, "Battery voltage"
      subMenu = sensorSettings,  "Sensor calibration"
   menu = "&Outputs"
      subMenu = outputSettings,  "Injection and spark"

[UserDefined]
   dialog = triggerSettings, "Trigger wheel"
      field = "Tooth positions (incl. missing)", toothPositions
      field = "Missing teeth",                   missingTeeth

   dialog = simSettings, "Crank simulator (bench only)"
      field = "#Feeds a perfect 60-2 signal into the decoder and ignores the real sensor."
      field = "#0 = off. Resets to off at power-up. NEVER leave on in the car."
      field = "Simulated rpm",                    simRpm
      field = "#Outputs only fire with ignition (+15) on. On the bench without 12 V on pin 60:"
      field = "Pretend ignition is on (bench only, resets at power-up)", benchIgn

   dialog = batterySettings, "Battery voltage"
      field = "Divider ratio (Rtop+Rbot)/Rbot",  battRatio

   dialog = sensorSettings, "Sensor calibration"
      field = "5 V input divider ratio",          in5vRatio
      field = "#Temperature sensors (IAT and coolant)"
      field = "Pull-up resistor",                 thermPullup
      field = "Resistance at 25 C",               thermR25
      field = "Beta",                             thermBeta
      field = "#Throttle position (watch the TPS Volts gauge)"
      field = "Closed throttle voltage",          tpsMin
      field = "Wide open throttle voltage",       tpsMax
      field = "#MAP sensor (linear)"
      field = "Pressure at 0 V",                  mapKpa0
      field = "Pressure at 5 V",                  mapKpa5
      field = "#Wideband controller output (linear)"
      field = "AFR at 0 V",                       afr0
      field = "AFR at 5 V",                       afr5

   dialog = outputSettings, "Injection and spark (fixed values, wasted spark)"
      field = "#Nothing fires unless enabled here. Bench test with no injectors or cassette connected first."
      field = "Fuel outputs",                     enableFuel
      field = "Spark outputs",                    enableSpark
      field = "Trigger angle (tooth 1, deg BTDC cyl 1)", triggerAngle
      field = "Spark advance (deg BTDC)",         fixedAdvance
      field = "DI trigger pulse",                 sparkPulse
      field = "Injector pulse width",             injPw
      field = "Injection start (deg BTDC)",       injAngle
      field = "Rev limit",                        revLimit

;-------------------------------------------------------------------------------
[GaugeConfigurations]
   gaugeCategory = "Trigger"
   ;  name          = var,         title,          units,  lo, hi,   loD, loW, hiW, hiD, vd, ld
   rpmGauge         = rpm,         "Engine Speed", "RPM",  0,  8000, 300, 600, 6500, 7000, 0, 0
   toothGauge       = tooth,       "Tooth",        "",     0,  60,   0,   0,   60,  60,  0, 0
   syncLossGauge    = syncLosses,  "Sync Losses",  "",     0,  100,  0,   0,   1,   10,  0, 0
   toothPeriodGauge = toothPeriod, "Tooth Period", "us",   0,  20000,0,   0,   20000,20000,0,0
   batteryGauge     = batteryVoltage, "Battery",    "V",    6,  18,   10,  11.5, 15,  15.5, 1, 1
   iatGauge         = iat,         "Intake Air",   "C",    -40, 120, -40, -40, 60,  80,  0, 0
   cltGauge         = coolant,     "Coolant",      "C",    -40, 130, -40, -40, 105, 115, 0, 0
   tpsGauge         = tps,         "Throttle",     "%",    0,  100,  -1,  -1,  101, 101, 1, 1
   tpsVoltsGauge    = tpsVolts,    "TPS Volts",    "V",    0,  5,    0.1, 0.1, 4.8, 4.9, 2, 2
   mapGauge         = map,         "MAP",          "kPa",  0,  260,  0,   0,   240, 250, 0, 0
   afrGauge         = afr,         "AFR",          "",     10, 20,   10.5, 11, 16,  17,  1, 1
   staleGauge       = staleEdges,  "Stale Edges",  "",     0,  1000, 0,   0,   1000, 1000, 0, 0
   gapMisGauge      = gapMismatch, "Gap Mismatch", "",     0,  1000, 0,   0,   1,   10,  0, 0
   overcountGauge   = overcount,   "Overcount",    "",     0,  1000, 0,   0,   1,   10,  0, 0
   stopGauge        = stopEvents,  "Stop Events",  "",     0,  1000, 0,   0,   1000, 1000, 0, 0
   advanceGauge     = advance,     "Advance",      "deg",  -10, 45,  -10, -10, 45,  45,  0, 0
   pwGauge          = pulseWidth,  "Pulse Width",  "ms",   0,  25,   0,   0,   20,  25,  2, 2
   sparkCountGauge  = sparkCount,  "Sparks",       "",     0,  65535, 0,  0,   65535, 65535, 0, 0
   injCountGauge    = injCount,    "Injections",   "",     0,  65535, 0,  0,   65535, 65535, 0, 0
   sparkSkipGauge   = sparkSkipped, "Spark Skipped", "",   0,  1000, 0,   0,   1,   10,  0, 0
   sparkPulseGauge  = sparkPulses, "Spark Pulses", "",     0,  65535, 0,  0,   65535, 65535, 0, 0
   injPulseGauge    = injPulses,   "Inj Pulses",   "",     0,  65535, 0,  0,   65535, 65535, 0, 0
   sdStateGauge     = sdState,     "SD State",     "",     0,  4,    -1,  -1,  1.5, 2,   0, 0
   sdErrorGauge     = sdError,     "SD Error",     "",     0,  20,   -1,  -1,  1,   1,   0, 0
   sdFreeGauge      = sdFree,      "SD Free",      "GB",   0,  64,   0,   0,   64,  64,  1, 1
   sleepGauge       = sleepIn,     "Sleep In",     "s",    0,  30,   0,   0,   30,  30,  1, 1
   overlapGauge     = overlaps,    "Overlaps",     "",     0,  1000, 0,   0,   1,   10,  0, 0
   mcuTempGauge     = mcuTemp,     "MCU Temp",     "C",    -40, 125, -40, -40, 70,  85,  0, 0

[FrontPage]
   gauge1 = rpmGauge
   gauge2 = toothGauge
   gauge3 = syncLossGauge
   gauge4 = toothPeriodGauge
   gauge5 = mcuTempGauge
   gauge6 = batteryGauge
   gauge7 = mapGauge
   gauge8 = cltGauge

   indicator = { synced }, "No Sync", "Synced", white, red, black, green
   indicator = { fuelOn },  "Fuel Off", "Fuel On", white, black, black, yellow
   indicator = { sparkOn }, "Spark Off", "Spark On", white, black, black, yellow
   indicator = { revLimited }, "Rev Limit", "REV LIMIT", white, black, white, red
   indicator = { ignOn },      "Ign Off", "Ign On", white, black, black, green
   indicator = { mainRelay },  "Main Relay", "Main Relay", white, black, black, green
   indicator = { fuelPump },   "Fuel Pump", "Fuel Pump", white, black, black, green
   indicator = { benchIgnOn }, "", "BENCH IGN", white, black, black, orange
   indicator = { heldAwake },  "", "Held Awake", white, black, black, yellow
   indicator = { sdReady },    "No SD", "SD OK", white, black, black, green
   indicator = { simActive },  "Real Crank", "SIMULATOR", white, black, black, orange

[Datalog]
   ;       name,         label,          type, format
   entry = time,         "Time",         float, "%.3f"
   entry = rpm,          "RPM",          int,   "%d"
   entry = tooth,        "Tooth",        int,   "%d"
   entry = synced,       "Sync",         int,   "%d"
   entry = syncLosses,   "SyncLosses",   int,   "%d"
   entry = toothPeriod,  "ToothPeriod",  int,   "%d"
   entry = mcuTemp,      "MCUTemp",      int,   "%d"
   entry = batteryVoltage, "Battery",    float, "%.1f"
   entry = iat,          "IAT",          int,   "%d"
   entry = coolant,      "CLT",          int,   "%d"
   entry = tps,          "TPS",          float, "%.1f"
   entry = tpsVolts,     "TPSVolts",     float, "%.3f"
   entry = map,          "MAP",          float, "%.1f"
   entry = afr,          "AFR",          float, "%.1f"
   entry = staleEdges,   "StaleEdges",   int,   "%d"
   entry = gapMismatch,  "GapMismatch",  int,   "%d"
   entry = overcount,    "Overcount",    int,   "%d"
   entry = stopEvents,   "StopEvents",   int,   "%d"
   entry = advance,      "Advance",      int,   "%d"
   entry = pulseWidth,   "PW",           float, "%.3f"
   entry = sparkCount,   "Sparks",       int,   "%d"
   entry = injCount,     "Injections",   int,   "%d"
   entry = sparkSkipped, "SparkSkipped", int,   "%d"
   entry = overlaps,     "Overlaps",     int,   "%d"
   entry = sparkPulses,  "SparkPulses",  int,   "%d"
   entry = injPulses,    "InjPulses",    int,   "%d"
   entry = powerState,   "PowerState",   int,   "%d"
   entry = mainRelay,    "MainRelay",    int,   "%d"
   entry = fuelPump,     "FuelPump",     int,   "%d"