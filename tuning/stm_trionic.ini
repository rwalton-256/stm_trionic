;-------------------------------------------------------------------------------
[ConstantExtensions]
   ; VE table is view-only in TunerStudio: the ECU's closed-loop learning owns these
   ; values (and the SD card persists them), so TunerStudio displays them live but
   ; never edits or burns them back. This also stops the burn-on-close tug-of-war.
   readOnly = veTable
   readOnly = veStatus
